# herdr plugin manifest for firstmate-tui. Link once with:
#   herdr plugin link /path/to/firstmate-tui/bin/firstmate-tui
# `firstmate-tui` (or `firstmate-tui open`) runs the board in the pane you
# type it in; `firstmate-tui open --detached` opens it as a tab pane in the
# current workspace instead (never splitting the captain pane). The open
# action below runs from herdr's command palette, which has no terminal to run
# in, so it carries --detached. Bind an action with:
#   [[keys.command]]
#   key = "prefix+y"
#   type = "plugin_action"
#   command = "firstmate.board.focus"
# Plugin commands run with this directory as cwd, so ../firstmate-tui.sh is the
# launcher. Up to 0.2.x this directory was bin/fm-board: a plugin linked at
# that path must be linked again once at the new one (herdr plugin unlink
# firstmate.board, then the link line above). The id firstmate.board stays,
# because linked plugins and the view-state directory are keyed by it.
# Actions carry no FM_HOME; write it once to
# "$(herdr plugin config-dir firstmate.board)/fm-home".

id = "firstmate.board"
name = "firstmate-tui"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "firstmate-tui: read-only board over the firstmate fleet: needs-you, review, in flight, findings, landed"
platforms = ["macos", "linux"]

[[panes]]
id = "board"
title = "firstmate-tui"
placement = "tab"
command = ["bash", "../firstmate-tui.sh", "open"]

[[actions]]
id = "open"
title = "Open firstmate-tui in a tab pane"
contexts = ["workspace"]
command = ["bash", "../firstmate-tui.sh", "open", "--detached"]

[[actions]]
id = "focus"
title = "Focus firstmate-tui"
contexts = ["workspace"]
command = ["bash", "../firstmate-tui.sh", "focus"]
