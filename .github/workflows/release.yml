# .github/workflows/release.yml - the one release path for firstmate-tui.
#
# The version source is "version" in bin/firstmate-tui/package.json; nobody tags by
# hand. scripts/package.sh builds every tarball (the same script
# tests/install.test.sh runs), and docs/releasing.md covers the flow.
#
# Every merge to main is a release. scripts/next-version.sh picks the version
# in both jobs from package.json and the existing tags, taking package.json's
# version when v<version> is free and the next free patch otherwise, so nobody
# opens a PR only to bump a version (bump minor or major in the PR that earns
# it).
#
#   push to a branch other than main   a per-commit beta, named against the
#                                      version the next merge will release:
#                                      package.sh --commit builds
#                                      firstmate-tui-v<next>-<sha7>.tar.gz and
#                                      a prerelease tagged v<next>-<sha7> is
#                                      created at that commit (0.2.5-d8b290e is
#                                      version 0.2.5 at commit d8b290e); then
#                                      betas beyond the newest 30 are deleted,
#                                      oldest first
#   push to main                       the release: when the picked version is
#                                      package.json's, build and create the
#                                      release at that commit; otherwise write
#                                      the version into package.json and the
#                                      lockfile, commit "Release <v> [skip ci]"
#                                      as github-actions[bot], push it to main
#                                      and release at that commit
#   pull_request closed                delete the betas (release and tag) of every
#                                      commit in the PR, merged or not
#   workflow_dispatch                  re-run the job for the branch it is run on
#
# The built-in token with contents: write creates and deletes releases and
# tags and pushes the bump commit. What the token itself does (creating the
# release's tag, pushing the bump) starts no run, and the [skip ci] marker in
# the bump's message is the second guard. One concurrency group per ref: two
# pushes to a branch build one after the other, never at once. Lint with
# actionlint; tests/install.test.sh pins the lines below that the installer
# and the docs depend on and checks scripts/next-version.sh.
name: Release

on:
  push:
    branches: ['**']
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # Hash betas beyond this many are deleted after each new one, oldest first.
  KEEP_BETAS: 30

jobs:
  beta:
    name: Beta ${{ github.ref_name }}
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Name the build
        id: name
        run: |
          # A beta carries the version the next merge to main will release
          # (scripts/next-version.sh against the repository's tags), stamped
          # into this checkout only: an unbumped branch builds 0.2.5-<sha7>
          # once v0.2.4 exists, not a second 0.2.4-<sha7>.
          version=$(node -p 'require("./bin/firstmate-tui/package.json").version')
          mapfile -t tags < <(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##')
          next=$(bash scripts/next-version.sh "$version" ${tags[@]+"${tags[@]}"})
          if [ "$next" != "$version" ]; then
            echo "package.json says $version, which is released already; this beta is built as $next"
            (cd bin/firstmate-tui && npm version "$next" --no-git-tag-version >/dev/null)
          fi
          tag="v$next-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "beta $tag already exists for commit $GITHUB_SHA; nothing to publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "building beta $tag from commit $GITHUB_SHA"
          fi

      - name: Build the tarball and checksum
        if: steps.name.outputs.exists == 'false'
        id: package
        run: |
          bash scripts/package.sh --commit "$GITHUB_SHA" dist > package.out
          cat package.out
          cat package.out >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -c -- *.tar.gz.sha256)

      - name: Create the prerelease
        if: steps.name.outputs.exists == 'false'
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          BRANCH: ${{ github.ref_name }}
        run: |
          {
            printf 'Beta build of firstmate-tui %s from commit %s on branch %s.\n\n' "$VERSION" "$GITHUB_SHA" "$BRANCH"
            printf 'Switch an install to it, or install it fresh:\n\n```sh\n'
            printf 'firstmate-tui upgrade --version %s\n' "$VERSION"
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/bin/install.sh | bash -s -- --version %s\n' "$GITHUB_REPOSITORY" "$VERSION"
            printf '```\n\nBack to the stable release: firstmate-tui upgrade --stable\n\n'
            printf 'The .sha256 file beside the tarball is the checksum the installer verifies. '
            printf 'Betas are deleted when their pull request closes, and at most %s are kept.\n' "$KEEP_BETAS"
          } > notes.md
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            "$TARBALL" "$CHECKSUM"
          echo "published beta $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Keep at most KEEP_BETAS hash betas
        run: |
          # Hash betas are the prereleases whose tag ends in -<7 hex>. Sorted by
          # creation time, everything before the newest KEEP_BETAS goes.
          betas=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.tag_name | test("^v.*-[0-9a-f]{7}$"))) | "\(.created_at) \(.tag_name)"' \
            | sort)
          total=$(printf '%s\n' "$betas" | grep -c . || true)
          if [ "$total" -le "$KEEP_BETAS" ]; then
            echo "$total hash beta(s) exist, within the limit of $KEEP_BETAS; nothing pruned"
            exit 0
          fi
          for tag in $(printf '%s\n' "$betas" | head -n "-$KEEP_BETAS" | cut -d' ' -f2); do
            echo "deleting beta $tag (beyond the newest $KEEP_BETAS)"
            gh release delete "$tag" --cleanup-tag --yes \
              || echo "::warning::could not delete $tag; another run may have removed it already"
          done

  release:
    name: Release ${{ github.ref_name }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Pick the release version
        id: pick
        run: |
          # Every merge to main is a release: package.json's version when its
          # tag is free, else the next free patch (scripts/next-version.sh).
          version=$(node -p 'require("./bin/firstmate-tui/package.json").version')
          mapfile -t tags < <(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##')
          next=$(bash scripts/next-version.sh "$version" ${tags[@]+"${tags[@]}"})
          {
            echo "version=$next"
            echo "tag=v$next"
            if [ "$next" = "$version" ]; then echo "bump=false"; else echo "bump=true"; fi
          } >> "$GITHUB_OUTPUT"
          if [ "$next" = "$version" ]; then
            echo "tag v$version does not exist yet; releasing firstmate-tui $version from commit $GITHUB_SHA"
          else
            echo "package.json says $version, already released as v$version; releasing firstmate-tui $next from a bump commit on main"
          fi

      - name: Commit the version bump to main
        if: steps.pick.outputs.bump == 'true'
        id: bump
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          # Written under the workflow's own identity. A push made with the
          # built-in token starts no workflow run and the [skip ci] marker is
          # the second guard, so this commit never releases itself again. If
          # main moved since the checkout the push is rejected and this run
          # fails; the run for that newer commit picks the version and
          # releases instead, carrying this commit's changes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd bin/firstmate-tui && npm version "$VERSION" --no-git-tag-version >/dev/null)
          git add bin/firstmate-tui/package.json bin/firstmate-tui/package-lock.json
          git commit -m "Release $VERSION [skip ci]"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed the bump commit $(git rev-parse --short HEAD) to main"

      - name: Build the tarball and checksum
        id: package
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          bash scripts/package.sh "$TAG" dist > package.out
          cat package.out
          cat package.out >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum -c -- *.tar.gz.sha256)

      - name: Create the release
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          # The bump commit when one was pushed, else the merge commit itself.
          TARGET: ${{ steps.bump.outputs.sha || github.sha }}
        run: |
          {
            printf 'Install firstmate-tui %s, or upgrade an install to it:\n\n```sh\n' "$VERSION"
            printf 'firstmate-tui upgrade\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/bin/install.sh | bash\n' "$GITHUB_REPOSITORY"
            printf '```\n\nThe .sha256 file beside the tarball is the checksum the installer verifies.\n'
          } > notes.md
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            "$TARBALL" "$CHECKSUM"
          echo "published release $TAG at $TARGET: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

  cleanup:
    name: Delete the betas of PR ${{ github.event.pull_request.number }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the prerelease and tag of every commit in the PR
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          shas=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" --jq '.[].sha[:7]')
          if [ -z "$shas" ]; then
            echo "PR #$PR has no commits; nothing to delete"
            exit 0
          fi
          betas=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease) | .tag_name')
          deleted=0
          for sha7 in $shas; do
            for tag in $(printf '%s\n' "$betas" | grep -E -- "-$sha7\$" || true); do
              echo "deleting beta $tag (commit $sha7 of PR #$PR)"
              gh release delete "$tag" --cleanup-tag --yes \
                || echo "::warning::could not delete $tag; another run may have removed it already"
              deleted=$((deleted + 1))
            done
          done
          echo "deleted $deleted beta(s) of PR #$PR; any beta of a commit no longer in the PR is pruned by the KEEP_BETAS limit"
